name: Publish Home Assistant image

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-home-assistant-image
  cancel-in-progress: false

jobs:
  prepare:
    # Standard runners are free only while the repository is public.
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
      pending: ${{ steps.metadata.outputs.pending }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:release
      - name: Read requested and published versions
        id: metadata
        run: node scripts/release.mjs prepare >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.event.repository.private == false && needs.prepare.outputs.pending == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set the version inside the image
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = readFileSync('config.yaml', 'utf8');
          writeFileSync('config.yaml', config.replace(/^version:.*$/m, `version: "${process.env.VERSION}"`));
          NODE
      - name: Build image
        run: |
          docker build --pull --platform "$PLATFORM" \
            --label "io.hass.type=app" \
            --label "io.hass.arch=$ARCH" \
            --label "io.hass.version=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:build-$GITHUB_RUN_ID-$ARCH" .
      - name: Test the image that will be published
        run: node scripts/test-ha-app.mjs "$IMAGE:build-$GITHUB_RUN_ID-$ARCH"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        run: docker push "$IMAGE:build-$GITHUB_RUN_ID-$ARCH"

  publish:
    needs: [prepare, build]
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify public images
        run: node scripts/release.mjs publish
      - name: Check out current main for promotion
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: release-main
          fetch-depth: 0
      - name: Advertise the verified release
        run: |
          node scripts/release.mjs promote release-main
          if git -C release-main diff --quiet -- config.yaml; then exit 0; fi
          git -C release-main config user.name 'github-actions[bot]'
          git -C release-main config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C release-main add config.yaml CHANGELOG.md
          git -C release-main commit -m "chore: release Home Assistant $VERSION"
          git -C release-main push origin HEAD:main
