name: Publish Home Assistant image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-home-assistant-image
  cancel-in-progress: false

jobs:
  build:
    # Standard runners are free only while the repository is public.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Use a release tag such as v0.9.8"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          grep -Fxq "version: \"$version\"" config.yaml || { echo "::error::Tag must match config.yaml version"; exit 1; }
          grep -Fxq "image: \"$image\"" config.yaml || { echo "::error::config.yaml must reference this repository's GHCR image"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker build --pull --platform "$PLATFORM" \
            --label "io.hass.type=app" \
            --label "io.hass.arch=$ARCH" \
            --label "io.hass.version=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:build-$GITHUB_RUN_ID-$ARCH" .
      - name: Test the image that will be published
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: node scripts/test-ha-app.mjs "$IMAGE:build-$GITHUB_RUN_ID-$ARCH"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: docker push "$IMAGE:build-$GITHUB_RUN_ID-$ARCH"

  publish:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a released version
        shell: bash
        run: |
          image_ref="$IMAGE:$VERSION"
          if result=$(docker buildx imagetools inspect "$image_ref" 2>&1); then
            echo "::error::Version already published; bump config.yaml and create a new tag"
            exit 1
          elif [[ "$result" != *"$image_ref: not found"* && "$result" != *"manifest unknown"* && "$result" != *"MANIFEST_UNKNOWN"* ]]; then
            printf '%s\n' "$result" >&2
            echo "::error::Could not check whether the release already exists"
            exit 1
          fi
      - name: Publish both architectures under the release version
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:build-$GITHUB_RUN_ID-amd64" \
            "$IMAGE:build-$GITHUB_RUN_ID-aarch64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
