# Copy these entries into Home Assistant's secrets.yaml; keep real personal values and credentials there.
home_harmony_dashboard_origin: "http://homeassistant.local:8099"
home_harmony_timetable_api_key: "YOUR_TIMETABLE_API_KEY"
main_ai_task_entity: "ai_task.your_vision_model"
main_announcement_speaker: "media_player.your_speaker"
main_notify_device: "notify.mobile_app_your_phone"
home_harmony_morning_scene: "scene.morgen"
home_harmony_calendar_prefix: "calendar.familie_"

# List order is notification order. The first group is always the shared group.
# Names must be unique and must not contain colons or line breaks.
# For each enabled timetable, copy its exact API member value into one person's
# timetable_member. Never assign a timetable to the shared group.
home_harmony_summary_groups:
  - name: Familie
    emoji: "🏡"
  - name: Voksen 1
    emoji: "👨"
  - name: Voksen 2
    emoji: "👩"
  - name: Barn 1
    emoji: "🧑"
    timetable_member: "home|person.child_one"
  - name: Barn 2
    emoji: "🧒"
    timetable_member: "home|person.child_two"

# Weekday numbers: 0 = Monday, 6 = Sunday. Reminders go in the shared group.
# Use {} to disable reminders; quote weekday keys.
home_harmony_weekly_reminders:
  "0": "Legg til en felles påminnelse her."
