name: Home Harmony UI
version: "0.8.2"
slug: home_harmony_ui
description: Afterglow family dashboard, calendars, lists and smart-home controls
url: https://github.com/cskogstrand/home-harmony-ui
arch:
  - aarch64
  - amd64
homeassistant: "2023.9.0"
startup: application
boot: auto
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Dashboard web interface (HTTP)
webui: http://[HOST]:[PORT:8099]/
options:
  home_assistant_url: http://homeassistant.local
  home_assistant_token: ""
  dashboard_password: ""
  dashboard_auth_disabled: false
  timetable_api_key: ""
schema:
  home_assistant_url: url
  home_assistant_token: password
  dashboard_password: password?
  dashboard_auth_disabled: bool
  timetable_api_key: password?
