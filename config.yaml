name: Home Harmony UI
version: "0.4.0"
slug: home_harmony_ui
description: Afterglow family dashboard, calendars, lists and smart-home controls
url: https://github.com/cskogstrand/home-harmony-ui
arch:
  - aarch64
  - amd64
homeassistant: "2023.9.0"
startup: application
boot: auto
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Dashboard web interface (HTTP)
webui: http://[HOST]:[PORT:8099]/
options:
  home_assistant_url: http://homeassistant:8123
schema:
  home_assistant_url: url
